<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Financial Manager</h1>
            <p class="subtitle">Track your income and expenses</p>
        </header>

        <div class="balance-section">
            <div class="balance-card">
                <h2>Current Balance</h2>
                <p class="balance-amount" id="balance">$0.00</p>
            </div>
            <div class="summary-cards">
                <div class="summary-card income">
                    <h3>Income</h3>
                    <p class="amount" id="income">$0.00</p>
                </div>
                <div class="summary-card expense">
                    <h3>Expenses</h3>
                    <p class="amount" id="expenses">$0.00</p>
                </div>
            </div>
        </div>

        <div class="transaction-form-section">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="salary">Salary</option>
                        <option value="freelance">Freelance</option>
                        <option value="investment">Investment</option>
                        <option value="food">Food</option>
                        <option value="transportation">Transportation</option>
                        <option value="utilities">Utilities</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="shopping">Shopping</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Transaction</button>
            </form>
        </div>

        <div class="transactions-section">
            <div class="transactions-header">
                <h2>Transaction History</h2>
                <div class="filter-controls">
                    <select id="filter-type">
                        <option value="all">All Transactions</option>
                        <option value="income">Income Only</option>
                        <option value="expense">Expenses Only</option>
                    </select>
                    <button id="clear-all" class="btn btn-danger">Clear All</button>
                </div>
            </div>
            <div id="transactions-list" class="transactions-list">
                <p class="empty-state">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
